<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07563e"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Fountain Gate Scorer"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.png"><title>Fountain Gate Cricket Club Scorer</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#17252a;background:#f4f7f5}*{box-sizing:border-box}body{margin:0}header{background:#07563e;color:white;padding:calc(14px + env(safe-area-inset-top)) 16px 14px}header h1{font-size:20px;margin:0}header small{opacity:.85}.wrap{max-width:750px;margin:auto;padding:14px 12px 90px}.card{background:white;border:1px solid #dbe6df;border-radius:15px;padding:15px;margin-bottom:12px;box-shadow:0 2px 5px #0b34230a}h2{font-size:18px;margin:0 0 12px}h3{font-size:15px;margin:12px 0 8px}label{display:block;font-size:12px;font-weight:700;color:#496257;margin:10px 0 4px}input,select,textarea{width:100%;border:1px solid #b9cfc4;border-radius:9px;background:white;padding:11px;font-size:16px;color:#142b22}button{border:1px solid #bdd1c5;background:white;color:#07563e;border-radius:10px;padding:11px 13px;font-size:14px;font-weight:700;cursor:pointer}button:disabled{opacity:.4}.primary{background:#07563e;color:white;border-color:#07563e}.danger{color:#b42318;border-color:#f3b8b2}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1;min-width:0}.between{justify-content:space-between}.between>*{flex:initial}.muted{color:#667d70;font-size:12px}.big{font-size:38px;font-weight:800;letter-spacing:-1px}.scoregrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.pill{background:#eaf5ee;border-radius:8px;padding:8px;font-size:13px}.tabs{display:flex;gap:5px;overflow-x:auto;margin-bottom:12px}.tabs button{white-space:nowrap;flex:1}.tabs .active{background:#07563e;color:white}.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.keys button{min-height:57px;font-size:22px}.keys .four{background:#d9f5e0}.keys .six{background:#e5dcff}.keys .wicket{background:#ffe0df;color:#a32220}.extras{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.extras button{font-size:13px}.selected{background:#b7e1cb!important;border:2px solid #07563e!important}.tablewrap{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:12px;white-space:nowrap}th,td{border-bottom:1px solid #e4ece7;padding:9px 5px;text-align:left}th{background:#eef5f0;color:#355746}td.num,th.num{text-align:right}.notice{background:#fff5da;padding:10px;border-radius:9px;font-size:13px}.footer{font-size:11px;color:#7a8980;text-align:center;padding:12px}.hidden{display:none}.chip{display:inline-block;border-radius:7px;padding:5px 7px;background:#eaf4ee;margin:2px;font-size:12px}.ball{display:inline-flex;min-width:29px;height:29px;align-items:center;justify-content:center;border:1px solid #c9d8cf;border-radius:6px;margin:3px;font-size:12px}.ball.w{background:#ffe0df;color:#b42318}.toolbar{display:flex;flex-wrap:wrap;gap:6px}.toolbar button{flex:1}.full{width:100%}details{margin:8px 0}summary{font-weight:700;color:#07563e;cursor:pointer}#toast{position:fixed;bottom:18px;left:15px;right:15px;max-width:500px;margin:auto;background:#203c30;color:white;border-radius:10px;padding:12px;text-align:center;display:none;z-index:10}@media(min-width:600px){.wrap{padding:20px 18px 80px}}
</style></head><body><header><div style="max-width:750px;margin:auto"><h1>🏏 Fountain Gate Cricket Club Scorer</h1><small>Offline scoring · temporary on-device recovery · no account</small></div></header><main id="app" class="wrap"></main><div id="toast"></div><script>
'use strict';
const KEY='ddca_scorer_current_v1';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date().toLocaleDateString('en-CA');
let match=null,tab='score',extra='normal',selectedRuns=0, editing=-1, currentInn=0;
try{match=JSON.parse(localStorage.getItem(KEY)||'null');if(match&&!Array.isArray(match.innings))match=null}catch(e){match=null}
function save(){if(match)localStorage.setItem(KEY,JSON.stringify(match));else localStorage.removeItem(KEY)}
function toast(t){let x=$('toast');x.textContent=t;x.style.display='block';setTimeout(()=>x.style.display='none',2400)}
function start(){const home=$('home').value.trim(),away=$('away').value.trim();if(!home||!away)return alert('Enter both team names');match={home,away,date:$('date').value,ground:$('ground').value,grade:$('grade').value,round:$('round').value,limit:Number($('limit').value)||40,innings:[{bat:home,bowl:away,players:[],bowlers:[],events:[],opening:['',''],firstBowler:''}],created:Date.now()};currentInn=0;save();render()}
function newInn(){if(match.innings.length>=2)return;const x=match.innings[0];match.innings.push({bat:x.bowl,bowl:x.bat,players:[],bowlers:[],events:[],opening:['',''],firstBowler:''});currentInn=1;tab='score';save();render()}
function innings(){return match.innings[currentInn]}
function addPlayer(kind){let name=prompt(kind==='players'?'Enter batter name':'Enter bowler name');if(!name||!name.trim())return;name=name.trim();let a=innings()[kind];if(!a.includes(name))a.push(name);save();render()}
function options(arr,value,placeholder){return `<option value="">${esc(placeholder||'Select player')}</option>`+arr.map(x=>`<option value="${esc(x)}" ${x===value?'selected':''}>${esc(x)}</option>`).join('')}
function updateOpening(i){innings().opening[i]=$('open'+i).value;save();render()}
function setFirstBowler(){innings().firstBowler=$('firstBowler').value;save();render()}
function initialState(inn){return {runs:0,wickets:0,legal:0,striker:inn.opening[0],non:inn.opening[1],bowler:inn.firstBowler,bat:{},bowl:{},fow:[],overs:[],history:[],extras:{wd:0,nb:0,b:0,lb:0,p:0},finished:false}}
function batStat(s,n){return s.bat[n]||(s.bat[n]={runs:0,balls:0,fours:0,sixes:0,out:''})}
function bowlStat(s,n){return s.bowl[n]||(s.bowl[n]={legal:0,runs:0,wickets:0,wd:0,nb:0,maidens:0,overs:[]})}
function compute(inn){
 let s=initialState(inn);s.issues=[];s.processed=0;s.completedOvers=[];
 if(!s.striker||!s.non||!s.bowler)return s;
 batStat(s,s.striker);batStat(s,s.non);
 for(let i=0;i<inn.events.length;i++){
  const e=inn.events[i];if(s.finished){s.issues.push('Deliveries exist after the innings ended');break}
  if(e.manualSwap){[s.striker,s.non]=[s.non,s.striker];s.history.push({control:true,notation:'↔',over:Math.floor(s.legal/6),striker:s.striker,score:s.runs,wickets:s.wickets});s.processed++;continue}
  const kind=e.kind||'normal',runs=Math.max(0,Number(e.runs)||0),legal=!['wd','nb','p'].includes(kind),overNum=Math.floor(s.legal/6);
  const before={striker:s.striker,non:s.non,bowler:s.bowler,over:overNum,ball:s.legal%6};
  if(e.bowler)s.bowler=e.bowler;
  if(!s.bowler){s.issues.push('Missing bowler at delivery '+(i+1));break}
  if(!s.striker||!s.non){s.issues.push('Missing active batter at delivery '+(i+1));break}
  const bs=bowlStat(s,s.bowler),str=batStat(s,s.striker);
  let total=0,bowlerRuns=0,rotation=0,notation='';
  if(kind==='normal'){total=runs;bowlerRuns=runs;str.runs+=runs;rotation=runs;str.balls++;if(runs===4)str.fours++;if(runs===6)str.sixes++;notation=String(runs)}
  else if(kind==='wd'){total=1+runs;bowlerRuns=total;s.extras.wd+=total;rotation=runs;notation='Wd'+(runs||'')}
  else if(kind==='nb'){let batRuns=e.nbType==='b'||e.nbType==='lb'?0:runs;total=1+runs;bowlerRuns=1+batRuns;s.extras.nb++;if(e.nbType==='b'||e.nbType==='lb')s.extras[e.nbType]+=runs;str.runs+=batRuns;rotation=runs;if(batRuns===4)str.fours++;if(batRuns===6)str.sixes++;notation='Nb'+(e.nbType?e.nbType.toUpperCase():'')+(runs||'')}
  else if(kind==='b'||kind==='lb'){total=runs;s.extras[kind]+=runs;rotation=runs;str.balls++;notation=(kind==='b'?'B':'Lb')+runs}
  else if(kind==='p'){total=runs;s.extras.p+=runs;notation='P'+runs}
  else {s.issues.push('Unknown delivery type at '+(i+1));break}
  if(legal){s.legal++;bs.legal++}
  s.runs+=total;bs.runs+=bowlerRuns;
  if(kind==='wd')bs.wd+=total;if(kind==='nb')bs.nb++;
  if(e.wicket){
   const d=e.dismissal||'Wicket',outName=e.outName||before.striker;
   if(![before.striker,before.non].includes(outName))s.issues.push('Dismissed batter not active at delivery '+(i+1));
   const credited=['Bowled','Caught','LBW','Stumped','Caught & bowled','Hit wicket'].includes(d);
   if(credited)bs.wickets++;
   const out=batStat(s,outName);out.out=d==='Run out'?'Run out'+(e.fielder?' ('+e.fielder+')':''):d==='Retired out'?'Retired out':d==='Retired hurt'?'Retired hurt':d+(e.fielder?' ('+e.fielder+')':'')+(credited?' b '+s.bowler:'');
   if(d!=='Retired hurt'){s.wickets++;s.fow.push({w:s.wickets,score:s.runs,name:outName,over:overs(s.legal)})}
   notation+=' W';
  }
  if(!s.overs[overNum])s.overs[overNum]=[];
  s.overs[overNum].push({notation,legal,bowler:s.bowler,runs:total,bowlRuns:bowlerRuns,wicket:!!e.wicket,kind,striker:before.striker});
  s.history.push({...before,notation,score:s.runs,wickets:s.wickets,legal,kind,total,bowlRuns,control:false});s.processed++;
  if(rotation%2)[s.striker,s.non]=[s.non,s.striker];
  if(e.wicket){let outName=e.outName||before.striker;if(s.striker===outName)s.striker=e.newBatter||'';else if(s.non===outName)s.non=e.newBatter||'';}
  if(legal&&s.legal%6===0){
   let over=s.overs[overNum];if(over.reduce((a,z)=>a+z.bowlRuns,0)===0)bs.maidens++;
   s.completedOvers.push({over:overNum+1,runs:s.runs,wickets:s.wickets,bowler:s.bowler});
   [s.striker,s.non]=[s.non,s.striker];s.bowler='';
  }
  if(s.wickets>=10||s.legal>=match.limit*6)s.finished=true;
 }
 return s;
}
function overs(n){return Math.floor(n/6)+'.'+(n%6)}
function ensureBowler(){let inn=innings(),s=compute(inn);if(s.bowler)return s.bowler;return inn.nextBowler||null}
function chooseNextBowler(){let inn=innings(),v=$('nextBowler').value;if(v==='__add__'){let n=prompt('Enter new bowler name');if(!n||!n.trim()){render();return}n=n.trim();if(!inn.bowlers.includes(n))inn.bowlers.push(n);v=n}const last=compute(inn).completedOvers.at(-1)?.bowler;if(v&&v===last){alert('The same bowler cannot bowl consecutive overs. Choose another bowler.');render();return}inn.nextBowler=v;save();render()}
function bowlerPicker(inn,s){if(s.finished)return '';const needs=s.legal>0&&s.legal%6===0&&!s.bowler;const current=s.bowler||inn.nextBowler||'';if(!needs)return `<div class="muted" style="margin:8px 0">Current bowler: <b>${esc(current||'Select first bowler in Players')}</b></div>`;return `<div class="card" style="border:2px solid #07563e;background:#f0faf4"><h2>🏏 Over ${Math.floor(s.legal/6)} complete!</h2><p><b>Select bowler for over ${Math.floor(s.legal/6)+1}</b> before recording the next delivery.</p><label for="nextBowler">Next bowler</label><select id="nextBowler" onchange="chooseNextBowler()">${options(inn.bowlers.filter(n=>n!==s.completedOvers.at(-1)?.bowler),current,'— Select next bowler —')}<option value="__add__">＋ Add a new bowler…</option></select>${current?`<p class="muted">Ready: ${esc(current)}</p>`:'<p class="notice">Select a bowler to continue scoring.</p>'}</div>`}

function record(){
 const inn=innings(),s=compute(inn);
 if(!s.striker||!s.non||!inn.firstBowler)return alert('Add two opening batters and the first bowler in Players first.');
 if(s.finished)return alert('Innings is complete.');
 const bowler=ensureBowler();if(!bowler)return alert('Select a bowler for this over first.');
 if(s.legal>0&&s.legal%6===0&&bowler===s.completedOvers.at(-1)?.bowler)return alert('Select a different bowler for the next over.');
 const e={kind:extra==='wicket'?'normal':extra,runs:extra==='wicket'?0:selectedRuns,bowler,wicket:extra==='wicket'};
 if(e.kind==='nb'&&e.runs>0){const t=prompt('No-ball additional runs: BAT, BYE or LEG BYE','BAT');if(t===null)return;e.nbType=/^b(ye)?$/i.test(t.trim())?'b':/^l(b|eg bye)$/i.test(t.trim())?'lb':'bat'}
 if(extra!=='wicket'&&document.getElementById('wicketWithRuns')?.checked)e.wicket=true;
 if(e.wicket){
  const d=prompt('Dismissal: Bowled, Caught, LBW, Run out, Stumped, Caught & bowled, Hit wicket, Retired out, Retired hurt','Caught');if(d===null)return;
  e.dismissal=d.trim()||'Caught';
  e.outName=prompt('Batter dismissed',s.striker)||s.striker;
  if(['Caught','Run out','Stumped','Caught & bowled'].includes(e.dismissal))e.fielder=prompt('Fielder name (optional)','')||'';
  if(s.wickets<9){let next=prompt('Incoming batter (leave blank to add later)','');if(next?.trim()){e.newBatter=next.trim();if(!inn.players.includes(e.newBatter))inn.players.push(e.newBatter)}}
 }
 inn.events.push(e);inn.nextBowler='';save();extra='normal';selectedRuns=0;render();
}
function undo(){let inn=innings();if(!inn.events.length)return;if(confirm('Undo last delivery?')){inn.events.pop();save();render()}}
function deleteEvent(i){if(confirm('Delete this ball and recalculate all later deliveries?')){innings().events.splice(i,1);save();render()}}
function editEvent(i){let e=innings().events[i];let kind=prompt('Type: normal, wd, nb, b, lb, p',e.kind);if(kind===null)return;if(!['normal','wd','nb','b','lb','p'].includes(kind))return alert('Invalid type');let runs=prompt('Runs (for wides/no-balls, enter additional runs beyond automatic 1)',e.runs);if(runs===null)return;if(!/^\d+$/.test(runs))return alert('Enter a whole number');e.kind=kind;e.runs=Number(runs);let wicket=confirm('Was there a wicket on this delivery?');e.wicket=wicket;if(wicket){e.dismissal=prompt('Dismissal type',e.dismissal||'Caught')||'Caught';e.outName=prompt('Batter out',e.outName||'')||'';e.fielder=prompt('Fielder (optional)',e.fielder||'')||'';e.newBatter=prompt('Incoming batter (optional)',e.newBatter||'')||''}else{delete e.dismissal;delete e.outName;delete e.fielder;delete e.newBatter}save();render()}
function changeBowler(i){let e=innings().events[i];let b=prompt('Bowler for this delivery',e.bowler);if(b&&b.trim()){e.bowler=b.trim();if(!innings().bowlers.includes(e.bowler))innings().bowlers.push(e.bowler);save();render()}}
function changeNewBatter(){let inn=innings(),s=compute(inn);let n=prompt('New batter name');if(!n||!n.trim())return;n=n.trim();if(!inn.players.includes(n))inn.players.push(n);let last=[...inn.events].reverse().find(e=>e.wicket&&!e.newBatter);if(last)last.newBatter=n;else if(!inn.opening[0])inn.opening[0]=n;else if(!inn.opening[1])inn.opening[1]=n;else return alert('No empty batting position found');save();render()}
function swapStrike(){let inn=innings(),s=compute(inn);if(!s.striker||!s.non)return; // record manual override as a zero-run non-delivery event
inn.events.push({kind:'p',runs:0,bowler:s.bowler||inn.events.at(-1)?.bowler||inn.firstBowler,manualSwap:true});save();render()}
function correctStrike(){let inn=innings();let a=prompt('Set striker name (this changes the current opening pair only if no deliveries scored)',compute(inn).striker);if(!a)return;if(inn.events.length)return alert('For a mid-innings strike correction, edit the delivery that caused the issue.');inn.opening[0]=a;save();render()}
function reset(){if(confirm('FINISH MATCH? This permanently clears the current match from this device. Export or copy your scorecard first.')){match=null;localStorage.removeItem(KEY);currentInn=0;tab='score';render()}}
function cell(txt){return `<td>${esc(txt)}</td>`}
function scoreboard(inn,s){return `<div class="card"><div class="between row"><div><b>${esc(inn.bat)}</b><div class="big">${s.runs}/${s.wickets}</div></div><div style="text-align:right"><b>${overs(s.legal)} / ${match.limit} overs</b><div class="muted">Run rate: ${s.legal?(s.runs/(s.legal/6)).toFixed(2):'0.00'}</div></div></div><div class="scoregrid" style="margin-top:12px"><div class="pill">🏏 ${esc(s.striker||'New batter needed')} *<br><b>${s.bat[s.striker]?.runs||0} (${s.bat[s.striker]?.balls||0})</b></div><div class="pill">🏏 ${esc(s.non||'New batter needed')}<br><b>${s.bat[s.non]?.runs||0} (${s.bat[s.non]?.balls||0})</b></div></div><div class="muted" style="margin-top:9px">Bowler: ${esc(s.bowler||'Choose bowler for next over')} · Extras: ${Object.values(s.extras).reduce((a,b)=>a+b,0)}</div>${s.finished?'<p class="notice">Innings complete</p>':''}</div>`}
function scoreTab(inn,s){let over=s.overs[Math.floor(s.legal/6)]||[];if(s.legal>0&&s.legal%6===0)over=s.overs[Math.floor(s.legal/6)-1]||[];return scoreboard(inn,s)+bowlerPicker(inn,s)+`<div class="card"><h2>Score this delivery</h2><div class="muted">Choose a delivery type, then runs, then tap Record Ball. Wide and no-ball automatically add 1 extra.</div><div class="extras" style="margin:12px 0">${[['normal','Bat'],['wd','Wide'],['nb','No ball'],['b','Byes'],['lb','Leg byes'],['p','Penalty']].map(([k,v])=>`<button class="${extra===k?'selected':''}" onclick="extra='${k}';render()">${v}</button>`).join('')}</div><div class="keys">${[0,1,2,3,4,5,6].map(n=>`<button class="${selectedRuns===n?'selected':''} ${n===4?'four':n===6?'six':''}" onclick="selectedRuns=${n};render()">${n}</button>`).join('')}<button class="wicket ${extra==='wicket'?'selected':''}" onclick="extra='wicket';selectedRuns=0;render()">W</button></div><label style="display:flex;align-items:center;gap:8px;margin-top:10px"><input id="wicketWithRuns" type="checkbox" style="width:auto"> Wicket on this delivery (including run out / no-ball)</label><p class="muted">${extra==='wd'||extra==='nb'?'Runs selected are additional to the 1 automatic extra.':extra==='wicket'?'Wicket details will be requested when recorded.':'Runs selected: '+selectedRuns}</p><button class="primary full" style="padding:17px" onclick="record()" ${s.legal>0&&s.legal%6===0&&!s.bowler&&!inn.nextBowler?'disabled':''}>Record Ball →</button><div class="toolbar" style="margin-top:10px"><button onclick="undo()">↶ Undo</button><button onclick="changeNewBatter()">+ New batter</button><button onclick="tab='events';render()">Edit balls</button></div></div><div class="card"><h3>Recent over</h3>${over.map(x=>`<span class="ball ${x.notation.includes('W')?'w':''}">${esc(x.notation)}</span>`).join('')||'<span class="muted">No deliveries yet</span>'}</div>`}
function playersTab(inn,s){return `<div class="card"><h2>Players · ${esc(inn.bat)}</h2><p class="muted">Add names whenever needed. You do not need a full XI before scoring.</p><button onclick="addPlayer('players')">+ Add batter</button>${inn.players.map(n=>`<span class="chip">${esc(n)}</span>`).join('')}<div class="row"><div><label>Opening striker</label><select id="open0" onchange="updateOpening(0)" ${inn.events.length?'disabled':''}>${options(inn.players,inn.opening[0])}</select></div><div><label>Opening non-striker</label><select id="open1" onchange="updateOpening(1)" ${inn.events.length?'disabled':''}>${options(inn.players,inn.opening[1])}</select></div></div></div><div class="card"><h2>Bowling · ${esc(inn.bowl)}</h2><button onclick="addPlayer('bowlers')">+ Add bowler</button>${inn.bowlers.map(n=>`<span class="chip">${esc(n)}</span>`).join('')}<label>First bowler</label><select id="firstBowler" onchange="setFirstBowler()" ${inn.events.length?'disabled':''}>${options(inn.bowlers,inn.firstBowler)}</select><p class="muted">After every completed over, select the next bowler from the dropdown on the Score tab, or add a new name.</p></div>`}
function cardBat(inn,s){let names=[...new Set([...inn.players,...Object.keys(s.bat)])];return `<div class="card"><h2>Batting · ${esc(inn.bat)}</h2><div class="tablewrap"><table><tr><th>Batter</th><th class="num">R</th><th class="num">B</th><th class="num">4</th><th class="num">6</th></tr>${names.map(n=>{let x=s.bat[n]||{runs:0,balls:0,fours:0,sixes:0};return `<tr><td><b>${esc(n)}</b><div class="muted">${esc(x.out||((s.striker===n||s.non===n)?'not out':'did not bat'))}</div></td><td class="num">${x.runs}</td><td class="num">${x.balls}</td><td class="num">${x.fours}</td><td class="num">${x.sixes}</td></tr>`}).join('')}</table></div><p><b>Extras:</b> ${Object.values(s.extras).reduce((a,b)=>a+b,0)} (Wd ${s.extras.wd}, Nb ${s.extras.nb}, B ${s.extras.b}, Lb ${s.extras.lb}, Pen ${s.extras.p})</p><b>Total ${s.runs}/${s.wickets} (${overs(s.legal)} overs)</b><h3>Fall of wickets</h3>${s.fow.map(x=>`<span class="chip">${x.w}-${x.score} ${esc(x.name)} (${x.over})</span>`).join('')||'<span class="muted">None</span>'}</div>`}
function cardBowl(inn,s){return `<div class="card"><h2>Bowling · ${esc(inn.bowl)}</h2><div class="tablewrap"><table><tr><th>Bowler</th><th class="num">O</th><th class="num">M</th><th class="num">R</th><th class="num">W</th><th class="num">Wd</th><th class="num">Nb</th></tr>${Object.entries(s.bowl).map(([n,x])=>`<tr><td>${esc(n)}</td><td class="num">${overs(x.legal)}</td><td class="num">${x.maidens}</td><td class="num">${x.runs}</td><td class="num">${x.wickets}</td><td class="num">${x.wd}</td><td class="num">${x.nb}</td></tr>`).join('')}</table></div></div>`}
function oversTab(inn,s){return `<div class="card"><h2>Over-by-over scorebook</h2><p class="muted">Each box represents a recorded delivery. Wd and Nb are not legal deliveries.</p><div class="tablewrap"><table><tr><th>Over</th><th>Deliveries</th><th class="num">Runs</th><th class="num">Wkts</th></tr>${s.overs.map((o,i)=>{let start=i?inn.events.length:0;return `<tr><td>${i+1}</td><td>${o.map(b=>`<span class="ball ${b.notation.includes('W')?'w':''}">${esc(b.notation)}</span>`).join('')}</td><td class="num">${o.reduce((a,b)=>a+b.runs,0)}</td><td class="num">${o.filter(b=>b.notation.includes('W')).length}</td></tr>`}).join('')}</table></div></div>`}
function eventsTab(inn,s){return `<div class="card"><h2>All recorded deliveries</h2><p class="muted">Edit or delete any delivery. Later totals and scorecards are recalculated automatically. Verify strike and bowler after editing older balls.</p><div class="tablewrap"><table><tr><th>#</th><th>Ball</th><th>Bowler</th><th>Action</th></tr>${inn.events.map((e,i)=>`<tr><td>${i+1}</td><td>${esc(s.history[i]?.notation||'—')}</td><td>${esc(e.bowler)}</td><td><button onclick="editEvent(${i})">Edit</button> <button onclick="changeBowler(${i})">Bowler</button> <button class="danger" onclick="deleteEvent(${i})">×</button></td></tr>`).join('')}</table></div></div>`}
function reconcile(inn){
 const s=compute(inn),bat=Object.values(s.bat).reduce((a,b)=>a+b.runs,0),extras=Object.values(s.extras).reduce((a,b)=>a+b,0),bowl=Object.values(s.bowl).reduce((a,b)=>a+b.runs,0);
 const nonBowler=s.extras.b+s.extras.lb+s.extras.p;
 const credited=Object.values(s.bowl).reduce((a,b)=>a+b.wickets,0);
 const issues=[...s.issues];
 if(bat+extras!==s.runs)issues.push('Batting runs plus extras do not equal innings total');
 if(bowl+nonBowler!==s.runs)issues.push('Bowling conceded plus byes, leg-byes and penalties do not equal innings total');
 if(s.fow.length!==s.wickets)issues.push('Fall of wickets does not match total wickets');
 if(credited>s.wickets)issues.push('Bowler credited with too many wickets');
 if(s.processed!==inn.events.length)issues.push('Some delivery records could not be processed');
 if(s.overs.some((o,i)=>o.filter(x=>x.legal).length>6))issues.push('An over contains more than six legal balls');
 return {s,bat,extras,bowl,issues};
}
function reconciliationPanel(){return match.innings.map((inn,i)=>{const r=reconcile(inn);return `<div class="card"><h3>Innings ${i+1} — Scorebook checks</h3><p>Batters ${r.bat} + Extras ${r.extras} = <b>${r.s.runs}</b> · Bowling conceded ${r.bowl} + Non-bowler extras ${r.s.extras.b+r.s.extras.lb+r.s.extras.p} = ${r.s.runs}</p>${r.issues.length?`<p class="notice">⚠ ${r.issues.map(esc).join('<br>')}</p>`:'<p style="color:#07563e">✓ All arithmetic and event-count checks passed</p>'}<p class="muted">Check dismissals, unusual running, penalty allocation and local competition rules manually.</p></div>`}).join('')}
function finishWithPrint(){if(!match)return;const ok=confirm('Have you printed or saved the scorebook PDF and checked it? Select OK to continue to the final deletion confirmation.');if(!ok)return;reset()}
function printClubScorebook(){
 if(!match)return;
 const style=`@page{size:A4 landscape;margin:5mm}*{box-sizing:border-box}body{margin:0;font:7px Arial,sans-serif;color:#111} .sheet{width:100%;page-break-after:always;break-after:page}.sheet:last-child{page-break-after:auto}table{border-collapse:collapse;table-layout:fixed;width:100%}th,td{border:0.5px solid #556e6a;padding:1px;overflow:hidden;vertical-align:middle;height:14px}th{background:#d7eae5;font-weight:700}.banner{font-size:14px;font-weight:800;color:#07563e;text-align:center;padding:4px;border:1px solid #345}.meta{display:grid;grid-template-columns:repeat(6,1fr);margin:3px 0}.meta>div{border:1px solid #667;padding:3px;font-size:8px}.sec{background:#cfe4dd;font-size:9px;font-weight:800;padding:3px;margin-top:4px;border:1px solid #345}.name{width:95px;text-align:left}.out{width:105px;text-align:left}.small{width:27px;text-align:center}.batbox{font-size:6.3px;line-height:1.2;text-align:left;overflow-wrap:anywhere}.bowlbox{font-size:6.3px;text-align:center;overflow-wrap:anywhere}.flex{display:grid;grid-template-columns:1fr 205px;gap:5px;margin-top:4px}.detail{display:grid;grid-template-columns:1.5fr 1fr;gap:4px}.detail>div{border:1px solid #567;padding:3px;min-height:35px;font-size:8px}.progress td,.progress th{height:12px;font-size:7px;text-align:center}.fine{font-size:7px;margin-top:4px}.check{margin-top:3px;font-size:7px}.pagehead{font-size:7px;text-align:right} @media screen{body{background:#dce2e0;padding:8px}.sheet{width:297mm;min-height:210mm;background:white;margin:0 auto 12px;padding:5mm;box-shadow:0 0 8px #888}}@media print{.screen{display:none!important}}`;
 const pages=match.innings.map((inn,idx)=>{
  const r=reconcile(inn),s=r.s,names=[...new Set([...inn.players,...Object.keys(s.bat)])],bowlers=[...new Set([...inn.bowlers,...Object.keys(s.bowl)])];
  const batting=Array.from({length:Math.max(11,names.length)},(_,i)=>{const n=names[i]||'',st=s.bat[n]||{runs:'',out:''};const deliveries=s.history.filter(h=>!h.control&&h.striker===n).map(h=>h.notation);const boxes=Array.from({length:15},(_,j)=>`<td class="batbox">${esc(deliveries.slice(j*8,j*8+8).join(' '))}</td>`).join('');return `<tr><td class="small">${i+1}</td><td class="name">${esc(n)}</td>${boxes}<td class="out">${esc(st.out|| (n?(s.striker===n||s.non===n?'Not out':'DNB'):''))}</td><td class="small">${st.runs}</td></tr>`}).join('');
  const bowling=Array.from({length:Math.max(10,bowlers.length)},(_,i)=>{const n=bowlers[i]||'',st=s.bowl[n]||{legal:0,maidens:0,runs:0,wickets:0};const boxes=Array.from({length:15},(_,j)=>{const balls=(s.overs[j]||[]).filter(x=>x.bowler===n).map(x=>x.notation);return `<td class="bowlbox">${esc(balls.join(' '))}</td>`}).join('');return `<tr><td class="small">${i+1}</td><td class="name">${esc(n)}</td>${boxes}<td class="small">${n?overs(st.legal):''}</td><td class="small">${n?st.maidens:''}</td><td class="small">${n?st.runs:''}</td><td class="small">${n?st.wickets:''}</td></tr>`}).join('');
  const overProgress=Array.from({length:Math.max(40,Math.ceil(s.overs.length/10)*10)},(_,i)=>{const o=s.overs[i];if(!o)return `<tr><td>${i+1}</td><td></td><td></td><td></td></tr>`;const last=s.history.filter(h=>!h.control&&h.over===i).at(-1);return `<tr><td>${i+1}</td><td>${esc(o.at(-1)?.bowler||'')}</td><td>${last?.score??''}</td><td>${last?.wickets??''}</td></tr>`}).join('');
  const fow=s.fow.map(x=>`${x.w}–${x.score} ${esc(x.name)} (${x.over})`).join(' · ')||'—';
  const checks=r.issues.length?'CHECK REQUIRED: '+r.issues.map(esc).join(' / '):'Arithmetic checks passed — manual rules review still required';
  return `<section class="sheet"><div class="banner">FOUNTAIN GATE CRICKET CLUB — DDCA-STYLE SCOREBOOK</div><div class="meta"><div>HOME: <b>${esc(match.home)}</b></div><div>AWAY: <b>${esc(match.away)}</b></div><div>DATE: <b>${esc(match.date)}</b></div><div>GRADE: <b>${esc(match.grade)}</b></div><div>ROUND: <b>${esc(match.round)}</b></div><div>GROUND: <b>${esc(match.ground)}</b></div></div><div class="sec">BATTING — ${esc(inn.bat)} · INNINGS ${idx+1}</div><table><thead><tr><th class="small">IN</th><th class="name">BATSMEN</th>${Array.from({length:15},(_,i)=>`<th>${i+1}</th>`).join('')}<th class="out">HOW OUT</th><th class="small">TOTAL</th></tr></thead><tbody>${batting}</tbody></table><div class="detail"><div><b>FALL OF WICKETS:</b> ${fow}<br><b>EXTRAS:</b> Byes ${s.extras.b} · Leg byes ${s.extras.lb} · Wides ${s.extras.wd} · No balls ${s.extras.nb} · Penalties ${s.extras.p} = ${r.extras}</div><div><b>RUNS SCORED:</b> ${s.runs} · <b>WICKETS:</b> ${s.wickets} · <b>OVERS:</b> ${overs(s.legal)}<br><b>BATTING RUNS:</b> ${r.bat} · <b>BOWLING RUNS:</b> ${r.bowl}</div></div><div class="flex"><div><div class="sec">BOWLERS — OVER-BY-OVER</div><table><thead><tr><th class="small">#</th><th class="name">BOWLERS</th>${Array.from({length:15},(_,i)=>`<th>${i+1}</th>`).join('')}<th class="small">O</th><th class="small">M</th><th class="small">R</th><th class="small">W</th></tr></thead><tbody>${bowling}</tbody></table><div class="sec">OVERS / EXTRAS / MATCH DETAILS</div><div class="detail"><div>Overs completed: ${s.completedOvers.length} · Run rate: ${s.legal?(s.runs*6/s.legal).toFixed(2):'0.00'} · Overs limit: ${match.limit}</div><div>Match: ${esc(match.home)} vs ${esc(match.away)}</div></div></div><div><div class="sec">PROGRESSIVE SCORE</div><table class="progress"><thead><tr><th>OVER</th><th>BOWLER</th><th>RUNS</th><th>WKTS</th></tr></thead><tbody>${overProgress}</tbody></table></div></div><div class="check">${checks}</div><div class="fine">Unofficial digital transcription sheet styled after the DDCA paper book. Not an association-issued or certified form. Verify scores and competition rules before submitting.</div></section>`;
 }).join('');
 const w=window.open('','_blank');if(!w)return alert('Allow pop-ups for the print preview.');
 w.document.open();w.document.write(`<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FGCC Scorebook Print</title><style>${style}</style></head><body><div class="screen" style="padding:10px;text-align:center"><button onclick="window.print()" style="padding:12px 22px">Print / Save as PDF</button> <span>Use A4 landscape and 100% scale</span></div>${pages}</body></html>`);w.document.close();
}
function summaryTab(){return `<div class="card"><h2>Match details</h2><p>${esc(match.home)} vs ${esc(match.away)}<br>${esc(match.date)} · ${esc(match.ground)} · ${esc(match.grade)} · Round ${esc(match.round)}</p></div>`+match.innings.map((inn,i)=>{let s=compute(inn);return `<h2>Innings ${i+1}</h2>`+scoreboard(inn,s)+cardBat(inn,s)+cardBowl(inn,s)+oversTab(inn,s)}).join('')+reconciliationPanel()+`<div class="card"><h2>Transfer to paper scorebook</h2><p class="muted">Open the DDCA-style print preview, save or print the PDF, then confirm the export before clearing. Print on A4 landscape; inspect alignment and scores before using for official records.</p><div class="toolbar"><button onclick="copySummary()">Copy text</button><button onclick="printClubScorebook()">Preview DDCA-style A4 scorebook / PDF</button><button class="danger" onclick="finishWithPrint()">Finish & clear (after export)</button></div></div>`}
function summaryText(){let a=[`FOUNTAIN GATE CRICKET CLUB SCOREBOOK`,`${match.home} v ${match.away}`,`${match.date} | ${match.ground} | ${match.grade} | Round ${match.round}`];match.innings.forEach((inn,i)=>{let s=compute(inn);a.push(`\nINNINGS ${i+1}: ${inn.bat} ${s.runs}/${s.wickets} (${overs(s.legal)} ov)`,`BATTING`);Object.entries(s.bat).forEach(([n,x])=>a.push(`${n}: ${x.runs} (${x.balls}), 4s ${x.fours}, 6s ${x.sixes}, ${x.out||'not out'}`));a.push(`Extras: ${JSON.stringify(s.extras)}`,'BOWLING');Object.entries(s.bowl).forEach(([n,x])=>a.push(`${n}: ${overs(x.legal)}-${x.maidens}-${x.runs}-${x.wickets}, wd ${x.wd}, nb ${x.nb}`));a.push('FOW: '+s.fow.map(x=>`${x.w}-${x.score} ${x.name} ${x.over}`).join('; '),'OVERS');s.overs.forEach((o,j)=>a.push(`${j+1}: ${o.map(x=>x.notation).join(' | ')}`))});return a.join('\n')}
async function copySummary(){let t=summaryText();try{await navigator.clipboard.writeText(t);toast('Scorebook summary copied')}catch(e){prompt('Copy scorebook text',t)}}
function render(){let el=$('app');if(!match){el.innerHTML=`<div class="card"><h2>Start a new match</h2><p class="muted">Your current match is temporarily recovered on this device until you explicitly clear it. No accounts or server storage.</p><label>Home team</label><input id="home" placeholder="Home team"><label>Away team</label><input id="away" placeholder="Away team"><div class="row"><div><label>Date</label><input id="date" type="date" value="${today()}"></div><div><label>Overs per innings</label><input id="limit" type="number" min="1" max="100" value="40"></div></div><label>Ground</label><input id="ground" placeholder="Ground"><div class="row"><div><label>Grade</label><input id="grade" placeholder="Grade"></div><div><label>Round</label><input id="round" placeholder="Round"></div></div><button class="primary full" style="margin-top:16px" onclick="start()">Create match</button></div><div class="card"><h3>Quick start</h3><p class="muted">1. Create match. 2. Add two batters and one bowler in Players. 3. Score each ball. 4. Copy or print the scorebook. 5. Clear the match.</p></div>`;return}
let inn=innings(),s=compute(inn);el.innerHTML=`<div class="row" style="margin-bottom:12px"><button class="${currentInn===0?'primary':''}" onclick="currentInn=0;render()">1st innings</button>${match.innings.length>1?`<button class="${currentInn===1?'primary':''}" onclick="currentInn=1;render()">2nd innings</button>`:`<button onclick="newInn()">+ 2nd innings</button>`}</div><div class="tabs">${[['score','Score'],['players','Players'],['card','Scorecard'],['overs','Overs'],['events','Edit'],['summary','Summary']].map(([k,v])=>`<button class="${tab===k?'active':''}" onclick="tab='${k}';render()">${v}</button>`).join('')}</div>${tab==='score'?scoreTab(inn,s):tab==='players'?playersTab(inn,s):tab==='card'?cardBat(inn,s)+cardBowl(inn,s):tab==='overs'?oversTab(inn,s):tab==='events'?eventsTab(inn,s):summaryTab()}<div class="card"><details><summary>Match controls & privacy</summary><p class="muted">This match is stored only in this browser's local storage for recovery. Clearing it deletes the local copy. Browser clearing, private browsing, or device changes may erase it earlier. Export before finishing.</p><button class="danger full" onclick="reset()">Finish match · permanently clear local data</button></details></div><div class="footer">Fountain Gate Cricket Club Scorer v2.0 · independent unofficial tool · verify against competition rules</div>`}
render();if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
