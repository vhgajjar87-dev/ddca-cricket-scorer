:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#17252a;background:#f4f7f5}*{box-sizing:border-box}body{margin:0}header{background:#07563e;color:white;padding:calc(14px + env(safe-area-inset-top)) 16px 14px}header h1{font-size:20px;margin:0}header small{opacity:.85}.wrap{max-width:750px;margin:auto;padding:14px 12px 90px}.card{background:white;border:1px solid #dbe6df;border-radius:15px;padding:15px;margin-bottom:12px;box-shadow:0 2px 5px #0b34230a}h2{font-size:18px;margin:0 0 12px}h3{font-size:15px;margin:12px 0 8px}label{display:block;font-size:12px;font-weight:700;color:#496257;margin:10px 0 4px}input,select,textarea{width:100%;border:1px solid #b9cfc4;border-radius:9px;background:white;padding:11px;font-size:16px;color:#142b22}button{border:1px solid #bdd1c5;background:white;color:#07563e;border-radius:10px;padding:11px 13px;font-size:14px;font-weight:700;cursor:pointer}button:disabled{opacity:.4}.primary{background:#07563e;color:white;border-color:#07563e}.danger{color:#b42318;border-color:#f3b8b2}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1;min-width:0}.between{justify-content:space-between}.between>*{flex:initial}.muted{color:#667d70;font-size:12px}.big{font-size:38px;font-weight:800;letter-spacing:-1px}.scoregrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.pill{background:#eaf5ee;border-radius:8px;padding:8px;font-size:13px}.tabs{display:flex;gap:5px;overflow-x:auto;margin-bottom:12px}.tabs button{white-space:nowrap;flex:1}.tabs .active{background:#07563e;color:white}.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.keys button{min-height:57px;font-size:22px}.keys .four{background:#d9f5e0}.keys .six{background:#e5dcff}.keys .wicket{background:#ffe0df;color:#a32220}.extras{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.extras button{font-size:13px}.selected{background:#b7e1cb!important;border:2px solid #07563e!important}.tablewrap{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:12px;white-space:nowrap}th,td{border-bottom:1px solid #e4ece7;padding:9px 5px;text-align:left}th{background:#eef5f0;color:#355746}td.num,th.num{text-align:right}.notice{background:#fff5da;padding:10px;border-radius:9px;font-size:13px}.footer{font-size:11px;color:#7a8980;text-align:center;padding:12px}.hidden{display:none}.chip{display:inline-block;border-radius:7px;padding:5px 7px;background:#eaf4ee;margin:2px;font-size:12px}.ball{display:inline-flex;min-width:29px;height:29px;align-items:center;justify-content:center;border:1px solid #c9d8cf;border-radius:6px;margin:3px;font-size:12px}.ball.w{background:#ffe0df;color:#b42318}.toolbar{display:flex;flex-wrap:wrap;gap:6px}.toolbar button{flex:1}.full{width:100%}details{margin:8px 0}summary{font-weight:700;color:#07563e;cursor:pointer}#toast{position:fixed;bottom:18px;left:15px;right:15px;max-width:500px;margin:auto;background:#203c30;color:white;border-radius:10px;padding:12px;text-align:center;display:none;z-index:10}@media(min-width:600px){.wrap{padding:20px 18px 80px}}
</style></head><body><header><div style="max-width:750px;margin:auto"><h1>🏏 Fountain Gate Cricket Club Scorer</h1><small>Offline scoring · temporary on-device recovery · no account</small></div></header><main id="app" class="wrap"></main><div id="toast"></div><script>
'use strict';
const KEY='ddca_scorer_current_v1';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date().toLocaleDateString('en-CA');
let match=null,tab='score',extra='normal',selectedRuns=0, editing=-1, currentInn=0;
try{match=JSON.parse(localStorage.getItem(KEY)||'null');if(match&&!Array.isArray(match.innings))match=null}catch(e){match=null}
function save(){if(match)localStorage.setItem(KEY,JSON.stringify(match));else localStorage.removeItem(KEY)}
function toast(t){let x=$('toast');x.textContent=t;x.style.display='block';setTimeout(()=>x.style.display='none',2400)}
function start(){const home=$('home').value.trim(),away=$('away').value.trim();if(!home||!away)return alert('Enter both team names');match={home,away,date:$('date').value,ground:$('ground').value,grade:$('grade').value,round:$('round').value,limit:Number($('limit').value)||40,innings:[{bat:home,bowl:away,players:[],bowlers:[],events:[],opening:['',''],firstBowler:''}],created:Date.now()};currentInn=0;save();render()}
function newInn(){if(match.innings.length>=2)return;const x=match.innings[0];match.innings.push({bat:x.bowl,bowl:x.bat,players:[],bowlers:[],events:[],opening:['',''],firstBowler:''});currentInn=1;tab='score';save();render()}
function innings(){return match.innings[currentInn]}
function addPlayer(kind){let name=prompt(kind==='players'?'Enter batter name':'Enter bowler name');if(!name||!name.trim())return;name=name.trim();let a=innings()[kind];if(!a.includes(name))a.push(name);save();render()}
function options(arr,value,placeholder){return `<option value="">${esc(placeholder||'Select player')}</option>`+arr.map(x=>`<option value="${esc(x)}" ${x===value?'selected':''}>${esc(x)}</option>`).join('')}
function updateOpening(i){innings().opening[i]=$('open'+i).value;save();render()}
function setFirstBowler(){innings().firstBowler=$('firstBowler').value;save();render()}
function initialState(inn){return {runs:0,wickets:0,legal:0,striker:inn.opening[0],non:inn.opening[1],bowler:inn.firstBowler,bat:{},bowl:{},fow:[],overs:[],history:[],extras:{wd:0,nb:0,b:0,lb:0,p:0},finished:false}}
function batStat(s,n){return s.bat[n]||(s.bat[n]={runs:0,balls:0,fours:0,sixes:0,out:''})}
function bowlStat(s,n){return s.bowl[n]||(s.bowl[n]={legal:0,runs:0,wickets:0,wd:0,nb:0,maidens:0,overs:[]})}
function compute(inn){let s=initialState(inn);if(!s.striker||!s.non||!s.bowler)return s;batStat(s,s.striker);batStat(s,s.non);for(let i=0;i<inn.events.length;i++){let e=inn.events[i];if(s.finished)break;let before={striker:s.striker,non:s.non,bowler:s.bowler,over:Math.floor(s.legal/6),ball:s.legal%6};if(e.bowler)s.bowler=e.bowler;let b=s.bowler;if(!b)break;let bs=bowlStat(s,b),str=batStat(s,s.striker),kind=e.kind||'normal',runs=Number(e.runs)||0,legal=kind!=='wd'&&kind!=='nb';let total=0,bowlerRuns=0,rotation=0;if(kind==='normal'){total=runs;bowlerRuns=runs;str.runs+=runs;rotation=runs;str.balls++;if(runs===4)str.fours++;if(runs===6)str.sixes++}else if(kind==='wd'){total=1+runs;bowlerRuns=total;s.extras.wd+=total;rotation=runs}else if(kind==='nb'){total=1+runs;bowlerRuns=total;s.extras.nb++;str.runs+=runs;rotation=runs;if(runs===4)str.fours++;if(runs===6)str.sixes++;str.balls++}else if(kind==='b'||kind==='lb'){total=runs;s.extras[kind]+=runs;rotation=runs;str.balls++}else if(kind==='p'){total=runs;s.extras.p+=runs;rotation=0;legal=false}
if(legal){s.legal++;bs.legal++}s.runs+=total;bs.runs+=bowlerRuns;if(kind==='wd')bs.wd+=total;if(kind==='nb')bs.nb++;
if(e.wicket){s.wickets++;let outName=e.outName||s.striker;let out=batStat(s,outName);out.out=(e.dismissal||'Wicket')+(e.fielder?' ('+e.fielder+')':'')+' b '+b;if(['Bowled','Caught','LBW','Stumped','Caught & bowled','Hit wicket'].includes(e.dismissal))bs.wickets++;s.fow.push({w:s.wickets,score:s.runs,name:outName,over:overs(s.legal)});}
let overNum=Math.floor(before.over);if(!s.overs[overNum])s.overs[overNum]=[];let notation=kind==='normal'?String(runs):kind==='wd'?'Wd'+(runs||''):kind==='nb'?'Nb'+(runs||''):kind==='b'?'B'+runs:kind==='lb'?'Lb'+runs:'P'+runs;if(e.wicket)notation+=' W';s.overs[overNum].push({notation,legal, bowler:b, runs:total, bowlRuns:bowlerRuns});s.history.push({...before,notation,score:s.runs,wickets:s.wickets});
if(rotation%2===1)[s.striker,s.non]=[s.non,s.striker];if(e.wicket){let outName=e.outName||before.striker;if(s.striker===outName)s.striker=e.newBatter||'';else if(s.non===outName)s.non=e.newBatter||'';else if(!e.newBatter)s.striker='';}
if(legal&&s.legal%6===0){let over=s.overs[overNum];let runsConceded=over.reduce((a,z)=>a+z.bowlRuns,0);if(runsConceded===0)bs.maidens++;[s.striker,s.non]=[s.non,s.striker];s.bowler='';}
if(s.wickets>=10||s.legal>=match.limit*6)s.finished=true;
}return s}
function overs(n){return Math.floor(n/6)+'.'+(n%6)}
function ensureBowler(){let inn=innings(),s=compute(inn);if(s.bowler)return s.bowler;let n=prompt('New over: bowler name (existing or new)');if(!n||!n.trim())return null;n=n.trim();if(!inn.bowlers.includes(n))inn.bowlers.push(n);return n}
function record(){let inn=innings(),s=compute(inn);if(!s.striker||!s.non||!inn.firstBowler)return alert('Add two opening batters and the first bowler in Players first.');if(s.finished)return alert('Innings is complete.');let bowler=ensureBowler();if(!bowler)return;let e={kind:extra,runs:selectedRuns,bowler,wicket:false};if(extra==='wicket'){e.kind='normal';e.runs=0;e.wicket=true;let d=prompt('Dismissal: Bowled, Caught, LBW, Run out, Stumped, Caught & bowled, Hit wicket, Retired out','Caught');if(d===null)return;e.dismissal=d.trim()||'Wicket';e.outName=prompt('Batter out',s.striker)||s.striker;if(e.dismissal==='Caught'||e.dismissal==='Run out'||e.dismissal==='Stumped')e.fielder=prompt('Fielder name (optional)','')||'';if(s.wickets<9){let next=prompt('New batter name (can be entered later)','');if(next&&next.trim()){e.newBatter=next.trim();if(!inn.players.includes(e.newBatter))inn.players.push(e.newBatter)}}}
inn.events.push(e);save();extra='normal';selectedRuns=0;render()}
function undo(){let inn=innings();if(!inn.events.length)return;if(confirm('Undo last delivery?')){inn.events.pop();save();render()}}
function deleteEvent(i){if(confirm('Delete this ball and recalculate all later deliveries?')){innings().events.splice(i,1);save();render()}}
function editEvent(i){let e=innings().events[i];let kind=prompt('Type: normal, wd, nb, b, lb, p',e.kind);if(kind===null)return;if(!['normal','wd','nb','b','lb','p'].includes(kind))return alert('Invalid type');let runs=prompt('Runs (for wides/no-balls, enter additional runs beyond automatic 1)',e.runs);if(runs===null)return;if(!/^\d+$/.test(runs))return alert('Enter a whole number');e.kind=kind;e.runs=Number(runs);let wicket=confirm('Was there a wicket on this delivery?');e.wicket=wicket;if(wicket){e.dismissal=prompt('Dismissal type',e.dismissal||'Caught')||'Caught';e.outName=prompt('Batter out',e.outName||'')||'';e.fielder=prompt('Fielder (optional)',e.fielder||'')||'';e.newBatter=prompt('Incoming batter (optional)',e.newBatter||'')||''}else{delete e.dismissal;delete e.outName;delete e.fielder;delete e.newBatter}save();render()}
function changeBowler(i){let e=innings().events[i];let b=prompt('Bowler for this delivery',e.bowler);if(b&&b.trim()){e.bowler=b.trim();if(!innings().bowlers.includes(e.bowler))innings().bowlers.push(e.bowler);save();render()}}
function changeNewBatter(){let inn=innings(),s=compute(inn);let n=prompt('New batter name');if(!n||!n.trim())return;n=n.trim();if(!inn.players.includes(n))inn.players.push(n);let last=[...inn.events].reverse().find(e=>e.wicket&&!e.newBatter);if(last)last.newBatter=n;else if(!inn.opening[0])inn.opening[0]=n;else if(!inn.opening[1])inn.opening[1]=n;else return alert('No empty batting position found');save();render()}
function swapStrike(){let inn=innings(),s=compute(inn);if(!s.striker||!s.non)return; // record manual override as a zero-run non-delivery event
inn.events.push({kind:'p',runs:0,bowler:s.bowler||inn.events.at(-1)?.bowler||inn.firstBowler,manualSwap:true});save();render()}
function correctStrike(){let inn=innings();let a=prompt('Set striker name (this changes the current opening pair only if no deliveries scored)',compute(inn).striker);if(!a)return;if(inn.events.length)return alert('For a mid-innings strike correction, edit the delivery that caused the issue.');inn.opening[0]=a;save();render()}
function reset(){if(confirm('FINISH MATCH? This permanently clears the current match from this device. Export or copy your scorecard first.')){match=null;localStorage.removeItem(KEY);currentInn=0;tab='score';render()}}
function cell(txt){return `<td>${esc(txt)}</td>`}
function scoreboard(inn,s){return `<div class="card"><div class="between row"><div><b>${esc(inn.bat)}</b><div class="big">${s.runs}/${s.wickets}</div></div><div style="text-align:right"><b>${overs(s.legal)} / ${match.limit} overs</b><div class="muted">Run rate: ${s.legal?(s.runs/(s.legal/6)).toFixed(2):'0.00'}</div></div></div><div class="scoregrid" style="margin-top:12px"><div class="pill">🏏 ${esc(s.striker||'New batter needed')} *<br><b>${s.bat[s.striker]?.runs||0} (${s.bat[s.striker]?.balls||0})</b></div><div class="pill">🏏 ${esc(s.non||'New batter needed')}<br><b>${s.bat[s.non]?.runs||0} (${s.bat[s.non]?.balls||0})</b></div></div><div class="muted" style="margin-top:9px">Bowler: ${esc(s.bowler||'Choose bowler for next over')} · Extras: ${Object.values(s.extras).reduce((a,b)=>a+b,0)}</div>${s.finished?'<p class="notice">Innings complete</p>':''}</div>`}
function scoreTab(inn,s){let over=s.overs[Math.floor(s.legal/6)]||[];if(s.legal>0&&s.legal%6===0)over=s.overs[Math.floor(s.legal/6)-1]||[];return scoreboard(inn,s)+`<div class="card"><h2>Score this delivery</h2><div class="muted">Choose a delivery type, then runs, then tap Record Ball. Wide and no-ball automatically add 1 extra.</div><div class="extras" style="margin:12px 0">${[['normal','Bat'],['wd','Wide'],['nb','No ball'],['b','Byes'],['lb','Leg byes'],['p','Penalty']].map(([k,v])=>`<button class="${extra===k?'selected':''}" onclick="extra='${k}';render()">${v}</button>`).join('')}</div><div class="keys">${[0,1,2,3,4,5,6].map(n=>`<button class="${selectedRuns===n?'selected':''} ${n===4?'four':n===6?'six':''}" onclick="selectedRuns=${n};render()">${n}</button>`).join('')}<button class="wicket ${extra==='wicket'?'selected':''}" onclick="extra='wicket';selectedRuns=0;render()">W</button></div><p class="muted">${extra==='wd'||extra==='nb'?'Runs selected are additional to the 1 automatic extra.':extra==='wicket'?'Wicket details will be requested when recorded.':'Runs selected: '+selectedRuns}</p><button class="primary full" style="padding:17px" onclick="record()">Record Ball →</button><div class="toolbar" style="margin-top:10px"><button onclick="undo()">↶ Undo</button><button onclick="changeNewBatter()">+ New batter</button><button onclick="tab='events';render()">Edit balls</button></div></div><div class="card"><h3>Recent over</h3>${over.map(x=>`<span class="ball ${x.notation.includes('W')?'w':''}">${esc(x.notation)}</span>`).join('')||'<span class="muted">No deliveries yet</span>'}</div>`}
function playersTab(inn,s){return `<div class="card"><h2>Players · ${esc(inn.bat)}</h2><p class="muted">Add names whenever needed. You do not need a full XI before scoring.</p><button onclick="addPlayer('players')">+ Add batter</button>${inn.players.map(n=>`<span class="chip">${esc(n)}</span>`).join('')}<div class="row"><div><label>Opening striker</label><select id="open0" onchange="updateOpening(0)" ${inn.events.length?'disabled':''}>${options(inn.players,inn.opening[0])}</select></div><div><label>Opening non-striker</label><select id="open1" onchange="updateOpening(1)" ${inn.events.length?'disabled':''}>${options(inn.players,inn.opening[1])}</select></div></div></div><div class="card"><h2>Bowling · ${esc(inn.bowl)}</h2><button onclick="addPlayer('bowlers')">+ Add bowler</button>${inn.bowlers.map(n=>`<span class="chip">${esc(n)}</span>`).join('')}<label>First bowler</label><select id="firstBowler" onchange="setFirstBowler()" ${inn.events.length?'disabled':''}>${options(inn.bowlers,inn.firstBowler)}</select><p class="muted">At the start of each new over, the scoring screen will ask for the bowler.</p></div>`}
function cardBat(inn,s){let names=[...new Set([...inn.players,...Object.keys(s.bat)])];return `<div class="card"><h2>Batting · ${esc(inn.bat)}</h2><div class="tablewrap"><table><tr><th>Batter</th><th class="num">R</th><th class="num">B</th><th class="num">4</th><th class="num">6</th></tr>${names.map(n=>{let x=s.bat[n]||{runs:0,balls:0,fours:0,sixes:0};return `<tr><td><b>${esc(n)}</b><div class="muted">${esc(x.out||((s.striker===n||s.non===n)?'not out':'did not bat'))}</div></td><td class="num">${x.runs}</td><td class="num">${x.balls}</td><td class="num">${x.fours}</td><td class="num">${x.sixes}</td></tr>`}).join('')}</table></div><p><b>Extras:</b> ${Object.values(s.extras).reduce((a,b)=>a+b,0)} (Wd ${s.extras.wd}, Nb ${s.extras.nb}, B ${s.extras.b}, Lb ${s.extras.lb}, Pen ${s.extras.p})</p><b>Total ${s.runs}/${s.wickets} (${overs(s.legal)} overs)</b><h3>Fall of wickets</h3>${s.fow.map(x=>`<span class="chip">${x.w}-${x.score} ${esc(x.name)} (${x.over})</span>`).join('')||'<span class="muted">None</span>'}</div>`}
function cardBowl(inn,s){return `<div class="card"><h2>Bowling · ${esc(inn.bowl)}</h2><div class="tablewrap"><table><tr><th>Bowler</th><th class="num">O</th><th class="num">M</th><th class="num">R</th><th class="num">W</th><th class="num">Wd</th><th class="num">Nb</th></tr>${Object.entries(s.bowl).map(([n,x])=>`<tr><td>${esc(n)}</td><td class="num">${overs(x.legal)}</td><td class="num">${x.maidens}</td><td class="num">${x.runs}</td><td class="num">${x.wickets}</td><td class="num">${x.wd}</td><td class="num">${x.nb}</td></tr>`).join('')}</table></div></div>`}
function oversTab(inn,s){return `<div class="card"><h2>Over-by-over scorebook</h2><p class="muted">Each box represents a recorded delivery. Wd and Nb are not legal deliveries.</p><div class="tablewrap"><table><tr><th>Over</th><th>Deliveries</th><th class="num">Runs</th><th class="num">Wkts</th></tr>${s.overs.map((o,i)=>{let start=i?inn.events.length:0;return `<tr><td>${i+1}</td><td>${o.map(b=>`<span class="ball ${b.notation.includes('W')?'w':''}">${esc(b.notation)}</span>`).join('')}</td><td class="num">${o.reduce((a,b)=>a+b.runs,0)}</td><td class="num">${o.filter(b=>b.notation.includes('W')).length}</td></tr>`}).join('')}</table></div></div>`}
function eventsTab(inn,s){return `<div class="card"><h2>All recorded deliveries</h2><p class="muted">Edit or delete any delivery. Later totals and scorecards are recalculated automatically. Verify strike and bowler after editing older balls.</p><div class="tablewrap"><table><tr><th>#</th><th>Ball</th><th>Bowler</th><th>Action</th></tr>${inn.events.map((e,i)=>`<tr><td>${i+1}</td><td>${esc(s.history[i]?.notation||'—')}</td><td>${esc(e.bowler)}</td><td><button onclick="editEvent(${i})">Edit</button> <button onclick="changeBowler(${i})">Bowler</button> <button class="danger" onclick="deleteEvent(${i})">×</button></td></tr>`).join('')}</table></div></div>`}
function printClubScorebook(){
const style=`@page{size:A4 landscape;margin:7mm}*{box-sizing:border-box}body{font-family:Arial,sans-serif;color:#111;margin:0;font-size:8px}.sheet{page-break-after:always}.sheet:last-child{page-break-after:auto}.title{text-align:center;font-size:16px;font-weight:800;color:#07563e;border:2px solid #07563e;padding:5px;letter-spacing:.6px}.meta{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin:5px 0}.meta div{border:1px solid #444;padding:4px;font-size:9px}.section{font-weight:800;background:#e4eee8;padding:4px;border:1px solid #333;font-size:10px;margin-top:6px}table{border-collapse:collapse;width:100%;table-layout:fixed}td,th{border:1px solid #555;padding:2px;vertical-align:middle;overflow-wrap:anywhere}th{background:#e8f0e9}td{height:18px}.name{width:110px;text-align:left}.narrow{width:28px;text-align:center}.seq{text-align:left;font-size:7px;line-height:1.35}.box{text-align:center;font-size:7px}.details{display:grid;grid-template-columns:1.4fr 1fr;gap:6px;margin-top:6px}.details>div{border:1px solid #444;padding:4px;min-height:43px}.footer{font-size:8px;text-align:right;margin-top:4px}@media screen{body{background:#ddd;padding:12px}.sheet{background:#fff;width:297mm;min-height:210mm;margin:0 auto 14px;padding:7mm;box-shadow:0 1px 10px #999}}`;
let pages=match.innings.map((inn,idx)=>{const s=compute(inn), names=[...new Set([...inn.players,...Object.keys(s.bat)])],bowlers=[...new Set([...inn.bowlers,...Object.keys(s.bowl)])];
const batting=names.map((n,i)=>{const st=s.bat[n]||{runs:0,balls:0,fours:0,sixes:0,out:''};const deliveries=s.history.filter(h=>h.striker===n).map(h=>h.notation);const columns=Array.from({length:12},(_,k)=>`<td class="seq">${esc(deliveries.slice(k*12,(k+1)*12).join(' · '))}</td>`).join('');return `<tr><td class="narrow">${i+1}</td><td class="name">${esc(n)}<div style="font-size:7px">${esc(st.out||'Not out / DNB')}</div></td>${columns}<td class="narrow">${st.runs}</td></tr>`}).join('');
const overData=s.overs.map((o,i)=>({number:i+1,balls:o.map(b=>b.notation).join(' '),runs:o.reduce((a,b)=>a+b.runs,0),wkts:o.filter(b=>b.notation.includes('W')).length}));
const bowling=bowlers.map((n,i)=>{const x=s.bowl[n]||{legal:0,runs:0,wickets:0,maidens:0,wd:0,nb:0};const perOver=Array.from({length:15},(_,k)=>{const v=(s.overs[k]||[]).filter(z=>z.bowler===n).map(z=>z.notation).join(' ');return `<td class="box">${esc(v)}</td>`}).join('');return `<tr><td class="narrow">${i+1}</td><td class="name">${esc(n)}</td>${perOver}<td class="narrow">${overs(x.legal)}</td><td class="narrow">${x.maidens}</td><td class="narrow">${x.runs}</td><td class="narrow">${x.wickets}</td></tr>`}).join('');
const extraTotal=Object.values(s.extras).reduce((a,b)=>a+b,0);
return `<section class="sheet"><div class="title">FOUNTAIN GATE CRICKET CLUB — SCOREBOOK</div><div class="meta"><div><b>HOME:</b> ${esc(match.home)}</div><div><b>AWAY:</b> ${esc(match.away)}</div><div><b>DATE:</b> ${esc(match.date)}</div><div><b>INNINGS:</b> ${idx+1}</div><div><b>GROUND:</b> ${esc(match.ground)}</div><div><b>GRADE:</b> ${esc(match.grade)}</div><div><b>ROUND:</b> ${esc(match.round)}</div><div><b>BATTING:</b> ${esc(inn.bat)}</div></div><div class="section">BATTING — DELIVERY MARKS BY BATTER (LEFT TO RIGHT)</div><table><thead><tr><th class="narrow">#</th><th class="name">BATSMAN / HOW OUT</th>${Array.from({length:12},(_,i)=>`<th>BOX ${i+1}</th>`).join('')}<th class="narrow">RUNS</th></tr></thead><tbody>${batting}${Array.from({length:Math.max(0,11-names.length)},()=>`<tr><td></td><td></td>${'<td></td>'.repeat(12)}<td></td></tr>`).join('')}</tbody></table><div class="details"><div><b>FALL OF WICKETS:</b> ${s.fow.map(x=>`${x.w}-${x.score} (${esc(x.name)}, ${x.over})`).join(' | ')||'—'}<br><b>EXTRAS:</b> Wides ${s.extras.wd} | No balls ${s.extras.nb} | Byes ${s.extras.b} | Leg byes ${s.extras.lb} | Penalties ${s.extras.p} = ${extraTotal}</div><div><b>TOTAL:</b> ${s.runs}/${s.wickets} in ${overs(s.legal)} overs &nbsp; <b>RUN RATE:</b> ${s.legal?(s.runs/(s.legal/6)).toFixed(2):'0.00'}<br><b>BOWLING TEAM:</b> ${esc(inn.bowl)}</div></div><div class="section">BOWLING — OVER-BY-OVER DELIVERY MARKS</div><table><thead><tr><th class="narrow">#</th><th class="name">BOWLER</th>${Array.from({length:15},(_,i)=>`<th>${i+1}</th>`).join('')}<th class="narrow">O</th><th class="narrow">M</th><th class="narrow">R</th><th class="narrow">W</th></tr></thead><tbody>${bowling}${Array.from({length:Math.max(0,10-bowlers.length)},()=>`<tr><td></td><td></td>${'<td></td>'.repeat(19)}</tr>`).join('')}</tbody></table><div class="section">OVER SUMMARY — CUMULATIVE RUNS AND WICKETS</div><table><thead><tr><th>OVER</th>${Array.from({length:15},(_,i)=>`<th>${i+1}</th>`).join('')}</tr></thead><tbody>${Array.from({length:Math.max(1,Math.ceil(overData.length/15))},(_,row)=>{let total=overData.slice(0,row*15).reduce((a,o)=>a+o.runs,0),wkts=overData.slice(0,row*15).reduce((a,o)=>a+o.wkts,0);return `<tr><th>RUNS / WKTS</th>${Array.from({length:15},(_,i)=>{const o=overData[row*15+i];if(!o)return '<td></td>';total+=o.runs;wkts+=o.wkts;return `<td class="box">${total}/${wkts}<br>${esc(o.balls)}</td>`}).join('')}</tr>`}).join('')}</tbody></table><div class="footer">Fountain Gate Cricket Club Scorer · unofficial digital transcription sheet · verify against official scorebook</div></section>`}).join('');
const w=window.open('','_blank');if(!w){alert('Allow pop-ups to open the printable scorebook.');return}w.document.open();w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>Fountain Gate Print Scorebook</title><style>${style}</style></head><body><div style="text-align:center;margin:6px" class="screen"><button onclick="window.print()" style="padding:10px 20px">Print / Save as PDF</button></div>${pages}<style>@media print{.screen{display:none}}</style></body></html>`);w.document.close();}
function summaryTab(){return `<div class="card"><h2>Match details</h2><p>${esc(match.home)} vs ${esc(match.away)}<br>${esc(match.date)} · ${esc(match.ground)} · ${esc(match.grade)} · Round ${esc(match.round)}</p></div>`+match.innings.map((inn,i)=>{let s=compute(inn);return `<h2>Innings ${i+1}</h2>`+scoreboard(inn,s)+cardBat(inn,s)+cardBowl(inn,s)+oversTab(inn,s)}).join('')+`<div class="card"><h2>Transfer to paper scorebook</h2><p class="muted">Copy this summary or use iPhone Share → Print / Save as PDF. Keep the match open until you've finished copying.</p><div class="toolbar"><button onclick="copySummary()">Copy text</button><button onclick="printClubScorebook()">Print club scorebook / PDF</button></div></div>`}
function summaryText(){let a=[`FOUNTAIN GATE CRICKET CLUB SCOREBOOK`,`${match.home} v ${match.away}`,`${match.date} | ${match.ground} | ${match.grade} | Round ${match.round}`];match.innings.forEach((inn,i)=>{let s=compute(inn);a.push(`\nINNINGS ${i+1}: ${inn.bat} ${s.runs}/${s.wickets} (${overs(s.legal)} ov)`,`BATTING`);Object.entries(s.bat).forEach(([n,x])=>a.push(`${n}: ${x.runs} (${x.balls}), 4s ${x.fours}, 6s ${x.sixes}, ${x.out||'not out'}`));a.push(`Extras: ${JSON.stringify(s.extras)}`,'BOWLING');Object.entries(s.bowl).forEach(([n,x])=>a.push(`${n}: ${overs(x.legal)}-${x.maidens}-${x.runs}-${x.wickets}, wd ${x.wd}, nb ${x.nb}`));a.push('FOW: '+s.fow.map(x=>`${x.w}-${x.score} ${x.name} ${x.over}`).join('; '),'OVERS');s.overs.forEach((o,j)=>a.push(`${j+1}: ${o.map(x=>x.notation).join(' | ')}`))});return a.join('\n')}
async function copySummary(){let t=summaryText();try{await navigator.clipboard.writeText(t);toast('Scorebook summary copied')}catch(e){prompt('Copy scorebook text',t)}}
function render(){let el=$('app');if(!match){el.innerHTML=`<div class="card"><h2>Start a new match</h2><p class="muted">Your current match is temporarily recovered on this device until you explicitly clear it. No accounts or server storage.</p><label>Home team</label><input id="home" placeholder="Home team"><label>Away team</label><input id="away" placeholder="Away team"><div class="row"><div><label>Date</label><input id="date" type="date" value="${today()}"></div><div><label>Overs per innings</label><input id="limit" type="number" min="1" max="100" value="40"></div></div><label>Ground</label><input id="ground" placeholder="Ground"><div class="row"><div><label>Grade</label><input id="grade" placeholder="Grade"></div><div><label>Round</label><input id="round" placeholder="Round"></div></div><button class="primary full" style="margin-top:16px" onclick="start()">Create match</button></div><div class="card"><h3>Quick start</h3><p class="muted">1. Create match. 2. Add two batters and one bowler in Players. 3. Score each ball. 4. Copy or print the scorebook. 5. Clear the match.</p></div>`;return}
let inn=innings(),s=compute(inn);el.innerHTML=`<div class="row" style="margin-bottom:12px"><button class="${currentInn===0?'primary':''}" onclick="currentInn=0;render()">1st innings</button>${match.innings.length>1?`<button class="${currentInn===1?'primary':''}" onclick="currentInn=1;render()">2nd innings</button>`:`<button onclick="newInn()">+ 2nd innings</button>`}</div><div class="tabs">${[['score','Score'],['players','Players'],['card','Scorecard'],['overs','Overs'],['events','Edit'],['summary','Summary']].map(([k,v])=>`<button class="${tab===k?'active':''}" onclick="tab='${k}';render()">${v}</button>`).join('')}</div>${tab==='score'?scoreTab(inn,s):tab==='players'?playersTab(inn,s):tab==='card'?cardBat(inn,s)+cardBowl(inn,s):tab==='overs'?oversTab(inn,s):tab==='events'?eventsTab(inn,s):summaryTab()}<div class="card"><details><summary>Match controls & privacy</summary><p class="muted">This match is stored only in this browser's local storage for recovery. Clearing it deletes the local copy. Browser clearing, private browsing, or device changes may erase it earlier. Export before finishing.</p><button class="danger full" onclick="reset()">Finish match · permanently clear local data</button></details></div><div class="footer">Fountain Gate Cricket Club Scorer · independent unofficial tool · verify against competition rules</div>`}
render();if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
